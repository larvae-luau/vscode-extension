name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and check formatting
        run: npx biome ci .

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx @vscode/vsce package
